<section class="section s-02" id="stats">

         стоит сверху. -->

      <div class="s-02__stat">
        <dt class="s-02__label">To launch your store</dt>

      </div>

      <div class="s-02__stat">
        <dt class="s-02__label">Products in catalog</dt>
        <dd class="s-02__value">50,000+</dd>
      </div>

      <div class="s-02__stat">
        <dt class="s-02__label">Countries served</dt>
        <dd class="s-02__value">38</dd>
      </div>

      <div class="s-02__stat">
        <dt class="s-02__label">Margin on digital products</dt>
        <dd class="s-02__value">Up to 100%</dd>
      </div>
    </dl>
  </div>
</section>
